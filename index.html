<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蟲神器 オンライン対戦盤</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#eef1f4;color:#222;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ccd2d8;border-radius:10px;padding:16px;margin-bottom:14px}
h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0 0 12px}.note{font-size:13px;color:#666;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}input[type=text],select{padding:9px;border:1px solid #aeb7c0;border-radius:6px;min-width:180px}
textarea{width:100%;height:270px;padding:10px;border:1px solid #aeb7c0;border-radius:6px;resize:vertical}
.primary{background:#2463eb;color:#fff;border:0;border-radius:7px;padding:9px 16px}.secondary{background:#fff;border:1px solid #9ca7b1;border-radius:7px;padding:8px 14px}.danger{background:#fff;border:1px solid #c55;color:#a00;border-radius:7px;padding:8px 14px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.count{font-size:13px;color:#555}
#game{height:100vh;max-width:none;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:8px;overflow:hidden}
.board{min-width:0;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:6px}
.player-board{min-height:0;background:#fff;border:1px solid #c7ced5;border-radius:8px;padding:5px;display:grid;grid-template-columns:74px 74px minmax(0,1fr);grid-template-rows:1fr 1fr 1fr 1fr;gap:4px;position:relative;overflow:hidden}
.player-label{position:absolute;left:6px;top:4px;font-size:11px;color:#666;z-index:3}
.zone{min-width:0;min-height:0;border:1px solid #c7ced5;background:#f7f8f9;border-radius:5px;padding:4px;overflow:hidden}
.zone-title{font-size:11px;font-weight:700;color:#555;height:16px;display:flex;justify-content:space-between}
.zone-cards{height:calc(100% - 16px);display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;flex-wrap:wrap}
.zone-discard{grid-column:1;grid-row:1/5}.zone-deck{grid-column:2;grid-row:1/5}.zone-field{grid-column:3;grid-row:1}.zone-territory{grid-column:3;grid-row:2}.zone-food{grid-column:3;grid-row:3}.zone-hand{grid-column:3;grid-row:4}
.card{width:46px;height:72px;border:1px solid #666;border-radius:4px;background:#fff;padding:3px;font-size:8px;line-height:1.15;text-align:center;word-break:break-word;overflow:hidden}
.card.back{background:#777;color:transparent}.card.known-back{background:#777;color:#fff}.card.mode-normal{background:#fff;color:#555}.card.mode-knownBack{background:#777;color:#fff}.discard-item.mode-normal{background:#fff;color:#555}.discard-item.mode-knownBack{background:#777;color:#fff}.deck-controls{display:flex;flex-direction:column;align-items:center;gap:3px}.zone-action{border:1px solid #9ca7b1;background:#fff;border-radius:5px;padding:3px 5px;font-size:9px;line-height:1.1}.zone-action:disabled{background:#d7dbe0;color:#8a9096}.card.selected{outline:2px solid #f09a24;box-shadow:0 0 0 1px #f09a24}.deck-card,.territory-card{width:46px;height:72px}.hand-card{width:48px;height:74px}.field-card{width:52px;height:80px}
.empty{font-size:10px;color:#aaa}.count-small{font-size:10px;color:#666}
.discard-list{height:calc(100% - 16px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.discard-item{width:100%;min-height:19px;border:1px solid #777;border-radius:3px;background:#fff;padding:2px 3px;font-size:8px;line-height:1.15;text-align:left;word-break:break-word;overflow:hidden}
.discard-item.back{background:#777;color:transparent}
.opponent-board{transform:rotate(180deg)}.opponent-board .zone-title,.opponent-board .card,.opponent-board .player-label,.opponent-board .empty,.opponent-board .discard-item{transform:rotate(180deg)}
.side{min-height:0;display:grid;grid-template-rows:96px minmax(0,1fr) 250px;gap:6px}
.side-info,.side-box{background:#fff;border:1px solid #c7ced5;border-radius:8px;padding:8px;min-height:0;overflow:hidden}.side-info{display:flex;align-items:center;justify-content:space-between;gap:8px}.info-left{min-width:0}.info-left .note{white-space:nowrap}
.badge{border:1px solid #c7ced5;border-radius:999px;padding:3px 8px;background:#fff;font-size:11px}.badge.me{border-color:#2463eb}.turn{padding:6px 8px;border:1px solid #c7ced5;border-radius:7px;background:#f5f7f9;font-weight:700;font-size:12px;white-space:nowrap}
.side-duo{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.side-duo .side-box{display:flex;flex-direction:column}
.history,.chat{flex:1;min-height:0;overflow:auto;font-size:11px;margin-top:5px}.history div,.chat div{padding:3px 0;border-bottom:1px solid #eceff1}.history .turn-end{color:#8a5a00;font-weight:700}
.chatform{display:flex;gap:4px;margin-top:5px}.chatform input{flex:1;min-width:0;padding:5px;border:1px solid #aeb7c0;border-radius:5px}
.actions-box{display:flex;flex-direction:column}.actions{margin-top:5px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.actions button{border:1px solid #9ca7b1;background:#fff;border-radius:6px;padding:7px 3px;font-size:12px}.actions .turn-button{background:#fff8df;border-color:#d4ad48}.primary:disabled,.secondary:disabled{background:#d7dbe0!important;color:#8a9096!important;border-color:#b9bec4!important;cursor:not-allowed}.discard-list{width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:1px}.discard-item{width:100%;min-height:25px;border:1px solid #888;border-radius:4px;background:#fff;padding:3px 4px;font-size:9px;line-height:1.1;word-break:break-word;cursor:pointer}.discard-item.selected{outline:2px solid #f09a24}.discard-item.back{background:#777;color:transparent}.discard-item.mode-knownBack{background:#777;color:#fff}
.selected-info{margin-top:6px;background:#f7f8f9;border:1px solid #d5dbe0;border-radius:6px;padding:6px;font-size:11px;display:flex;align-items:center;gap:5px;min-height:30px}
.wait{font-size:11px;color:#805d00;background:#fff8e6;border:1px solid #e2c878;border-radius:5px;padding:4px 6px;margin-top:5px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal-box{background:#fff;border-radius:9px;padding:15px;max-width:720px;width:90%;max-height:85vh;display:flex;flex-direction:column}
.modal-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;overflow:auto;padding:5px}.modal-card{border:1px solid #888;border-radius:6px;background:#fff;padding:8px;min-height:72px;text-align:left;font-size:12px}.modal-card.back{background:#777;color:#fff}.modal-card.known-back{background:#777;color:#fff}.modal-actions{text-align:right;margin-top:8px}
.error-msg{color:#c55;font-size:12px;margin-top:5px}
@media(max-width:1050px){#game{grid-template-columns:minmax(0,1fr) 350px}.player-board{grid-template-columns:58px 58px minmax(0,1fr)}.card{width:40px;height:62px}}
</style>
</head>
<body>
<div id="lobby" class="wrap">
<h1>蟲神器 オンライン対戦盤</h1>
<p class="note">Firebaseを使用したオンライン対戦盤です。同じ部屋番号を入力して2人で入室してください。</p>
<div class="grid2">
<div class="panel"><h2>部屋</h2><p>部屋番号<br><input id="roomNo" type="text" maxlength="20" placeholder="例：1234"></p>
<p class="note">存在しない番号なら作成、存在する番号なら入室します。デッキは入室時に登録します。</p>
<button id="enter" class="primary">部屋を作る / 入る</button><div id="lobbyError" class="error-msg"></div></div>
<div class="panel"><h2>自分のデッキ（20枚）</h2><textarea id="deck" placeholder="1行につき1枚。カード名だけでもOKです。"></textarea><div id="deckCount" class="count">0 / 20 枚</div></div>
</div>
</div>

<div id="game" class="wrap hidden">
<main id="board" class="board"></main>
<aside class="side">
<div class="side-info"><div class="info-left"><b>対戦情報</b><div class="note">部屋：<b id="room"></b></div><div id="players" class="row"></div><div id="wait" class="wait hidden"></div></div>
<div class="row"><span id="sideFirst" class="turn">先攻：未決定</span><button id="firstBtn" class="secondary">先攻設定</button><button id="startBtn" class="primary">対戦開始</button></div></div>
<div class="side-duo">
<div class="side-box"><b>履歴</b><div id="history" class="history"></div></div>
<div class="side-box"><b>チャット</b><div id="chat" class="chat"></div><div class="chatform"><input id="chatInput" maxlength="200" placeholder="メッセージ"><button id="send" class="secondary">送信</button></div></div>
</div>
<div class="side-box actions-box"><b>操作</b><div class="actions">
<button data-to="food">エサ場へ</button><button data-to="field">場へ</button><button data-to="discard">捨て札へ</button><span></span>
<button data-to="hand">手札へ</button><button data-to="deck">山札の一番下へ</button><button id="down">裏向き</button><button id="up">表向き</button>
<button id="turnEnd">ターン終了</button><button id="undo">一手戻す</button><span></span><span></span>
</div><div class="selected-info"><b>選択：</b><span id="selectedText">なし</span></div><div class="row" style="margin-top:5px"><button id="rematch" class="secondary">再戦</button><button id="end" class="danger">終了</button></div></div>
</aside>
</div>

<div id="discardModal" class="modal hidden"><div class="modal-box"><h3 id="discardTitle">捨て札</h3><div id="discardList" class="modal-list"></div><div class="modal-actions"><button id="closeDiscard" class="secondary">閉じる</button></div></div></div>
<div id="firstModal" class="modal hidden"><div class="modal-box" style="max-width:420px"><h3>先攻の決定</h3><p class="note">2人が入室した後に決定します。</p><select id="firstChoice" style="width:100%;margin-top:5px"><option value="random">ランダム</option><option value="p1">プレイヤー1が先攻</option><option value="p2">プレイヤー2が先攻</option></select><div class="modal-actions"><button id="firstOk" class="primary">決定</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, runTransaction, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZEjzEW_QeETXZceSlzxasNBDKvSxPhYk",
  authDomain: "mushi-online.firebaseapp.com",
  databaseURL: "https://mushi-online-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "mushi-online",
  storageBucket: "mushi-online.firebasestorage.app",
  messagingSenderId: "885644779431",
  appId: "1:885644779431:web:4a7f158e1711a853b2e082"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const areas = ["hand","deck","field","food","territory","discard"];
const names = {hand:"手札",deck:"山札",field:"場",food:"エサ場",territory:"縄張り",discard:"捨て札"};
let roomNo="", roomPath="", meId="", meSlot="", state=null, selected=null, undoStack=[], unsubscribe=null;

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
function deckInput(){return $("deck").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}
$("deck").oninput=()=> $("deckCount").textContent=deckInput().length+" / 20 枚";

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeAreas(deck){let c=shuffle(deck).map(n=>({id:uid(),name:n,faceUp:true}));return{hand:c.slice(0,4),territory:c.slice(4,10),deck:c.slice(10),field:[],food:[],discard:[]}}

function log(t,kind="normal"){
  state.history.push({t:Date.now(),text:t,kind});
  if(state.history.length>100)state.history.shift();
}
function snap(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length>30)undoStack.shift();
}
function roomRef(){return ref(db, roomPath)}
function saveState(){
  if(!roomPath)return;
  state.updatedAt = Date.now();
  set(roomRef(), state).catch(console.error);
}

function startGame(){
  if(state.players.length!==2){alert("2人そろってから開始してください。");return}
  if(state.started)return;
  state.players.forEach(p=>p.areas=makeAreas(p.deck));
  const choice=state.firstChoice||"random";
  state.first=choice==="random"?state.players[Math.floor(Math.random()*2)].slot:choice;
  state.started=true;
  state.history=[];
  state.history.push({t:Date.now(),type:"start",first:state.first,text:"対戦を開始しました"});
  selected=null;
  saveState();
}

function cardMode(c,owner,area){
  if(area==="hand"&&owner!==meId)return"back";
  if(area==="deck"||area==="territory")return"back";
  return c.faceUp?"normal":(c.knownName?"knownBack":"back");
}

function makeCard(c,owner,area,index){
  let mode=cardMode(c,owner,area), b=document.createElement("button");
  b.className="card "+area+"-card mode-"+mode+" "+(mode==="back"?"back ":"")+(mode==="knownBack"?"known-back ":"")+(selected&&selected.owner===owner&&selected.area===area&&selected.index===index?"selected":"");
  b.textContent=(mode==="normal"||mode==="knownBack")?c.name:"";
  b.title=(mode==="normal"||mode==="knownBack")?c.name:"裏向き";
  if(owner!==meId){b.disabled=true;b.classList.remove("selected")}
  else b.onclick=()=>{selected={owner,area,index};render()};
  return b;
}

function drawZone(owner,area){
  let p=state.players.find(x=>x.id===owner), z=document.createElement("div");
  z.className="zone zone-"+area;
  let title=document.createElement("div");
  title.className="zone-title";
  title.innerHTML=`<span>${names[area]}</span><span class="count-small">${p.areas[area].length}枚</span>`;
  z.appendChild(title);
  let cs=document.createElement("div");
  cs.className="zone-cards";
  
  if(area==="discard"){
    let list=document.createElement("div");list.className="discard-list";
    p.areas.discard.forEach((c,i)=>{
      let b=document.createElement("button"),mode=c.faceUp?"normal":(c.knownName?"knownBack":"back");
      b.className="discard-item mode-"+mode+" "+(mode==="back"?"back ":"")+(mode==="knownBack"?"known-back ":"")+(selected&&selected.owner===owner&&selected.area===area&&selected.index===i?"selected":"");
      b.textContent=mode==="normal"||mode==="knownBack"?c.name:"";
      b.title=mode==="normal"||mode==="knownBack"?c.name:"裏向き";
      if(owner===meId)b.onclick=()=>{selected={owner,area:"discard",index:i};render()};
      else b.disabled=true;
      list.appendChild(b);
    });
    if(!p.areas.discard.length){let e=document.createElement("span");e.className="empty";e.textContent="空";list.appendChild(e)}
    cs.appendChild(list);
  }else if(area==="deck"){
    if(p.areas.deck.length){
      let wrap=document.createElement("div");wrap.className="deck-controls";
      let x=document.createElement("button");
      x.className="card deck-card back "+(selected&&selected.owner===owner&&selected.area==="deck"&&selected.index===0?"selected":"");
      x.title="山札の一番上";
      if(owner===meId)x.onclick=()=>{selected={owner,area:"deck",index:0};render()};
      else x.disabled=true;
      wrap.appendChild(x);
      if(owner===meId){
        let draw=document.createElement("button");
        draw.className="zone-action";draw.textContent="手札に引く";
        draw.onclick=()=>drawTopToHand();
        wrap.appendChild(draw);
      }
      cs.appendChild(wrap);
    }else{let e=document.createElement("span");e.className="empty";e.textContent="空";cs.appendChild(e)}
  }else if(area==="territory"){
    p.areas[area].forEach((c,i)=>cs.appendChild(makeCard(c,owner,area,i)));
    if(!p.areas[area].length){let e=document.createElement("span");e.className="empty";e.textContent="空";cs.appendChild(e)}
    if(owner===meId&&p.areas.territory.length){
      let draw=document.createElement("button");
      draw.className="zone-action";draw.textContent="縄張りを引く";
      draw.onclick=()=>drawTerritory();
      cs.appendChild(draw);
    }
  }else{
    p.areas[area].forEach((c,i)=>cs.appendChild(makeCard(c,owner,area,i)));
    if(!p.areas[area].length){let e=document.createElement("span");e.className="empty";e.textContent="空";cs.appendChild(e)}
  }
  z.appendChild(cs);
  if(owner===meId){
    z.classList.add("clickable-zone");
    z.onclick=e=>{if(!selected||e.target.closest(".card")||e.target.closest("button"))return;move(area)}
  }
  return z;
}

function playerBoard(owner){
  let box=document.createElement("section");
  box.className="player-board "+(owner===meId?"your-board":"opponent-board");
  areas.forEach(a=>box.appendChild(drawZone(owner,a)));
  return box;
}

function historyCardText(card,to){return["field","food","discard"].includes(to)&&card.faceUp?card.name:"非公開カード"}

function render(){
  if(!state)return;
  $("room").textContent=roomNo;
  $("players").innerHTML=state.players.map(p=>`<span class="badge ${p.id===meId?"me":""}">${p.slot}</span>`).join("");
  let fp=state.players.find(p=>p.slot===state.first);
  $("sideFirst").textContent=fp?`先攻：${fp.slot}`:"先攻：未決定";
  $("firstBtn").disabled=state.players.length<2||state.started||meSlot!=="p1";
  $("startBtn").disabled=state.players.length<2||state.started||meSlot!=="p1";
  
  let board=$("board");board.innerHTML="";
  state.players.slice().sort((a,b)=>(a.id===meId?1:0)-(b.id===meId?1:0)).forEach(p=>board.appendChild(playerBoard(p.id)));
  
  let c=selected?state.players.find(p=>p.id===selected.owner)?.areas[selected.area]?.[selected.index]:null;
  $("selectedText").textContent=c?`${names[selected.area]} / ${selected.area==="deck"?"山札の一番上":c.name}${c.faceUp?"（表）":"（裏）"}`:"なし";
  
  $("history").innerHTML=state.history.slice().reverse().map(h=>{
    let text=h.type==="start"?`対戦を開始しました（先攻：${h.first}）`:h.text;
    return `<div class="${h.kind==="turnend"?"turn-end":""}">${new Date(h.t).toLocaleTimeString()} ${text}</div>`;
  }).join("");
  
  $("chat").innerHTML=(state.chat||[]).slice(-80).map(x=>`<div><b>${x.slot}：</b>${x.text}</div>`).join("");
  let waiting=state.players.length<2||!state.started;
  $("wait").classList.toggle("hidden",!waiting);
  if(waiting)$("wait").textContent=state.players.length<2?"相手の入室待ちです。":"先攻を決めて「対戦開始」を押してください。";
}

function drawTopToHand(){
  if(!state||!state.started)return;
  let p=state.players.find(x=>x.id===meId);if(!p||!p.areas.deck.length)return;
  snap();let c=p.areas.deck.shift();p.areas.hand.push(c);
  log(`山札 → 手札（${c.name}）`);selected=null;saveState();render();
}

function drawTerritory(){
  if(!state||!state.started)return;
  let p=state.players.find(x=>x.id===meId);if(!p||!p.areas.territory.length)return;
  snap();let c=p.areas.territory.shift();p.areas.hand.push(c);
  log(`縄張り → 手札（非公開カード）`);selected=null;saveState();render();
}

function turnEnd(){
  if(!state||!state.started)return;
  log(`ターンを終了しました`,"turnend");saveState();render();
}

function move(to){
  if(!selected)return;
  let p=state.players.find(x=>x.id===selected.owner),arr=p?.areas[selected.area],c=arr?.[selected.index];if(!c)return;
  if(p.id!==meId)return;
  snap();let from=selected.area;arr.splice(selected.index,1);
  if(to==="deck")p.areas.deck.push(c);else p.areas[to].push(c);
  log(`${names[from]} → ${to==="deck"?"山札の一番下":names[to]}（${historyCardText(c,to)}）`);
  selected=null;saveState();render();
}

function face(up){
  if(!selected||selected.owner!==meId)return;
  let p=state.players.find(x=>x.id===selected.owner),arr=p?.areas[selected.area],c=arr?.[selected.index];if(!c)return;
  snap();
  if(!up && c.faceUp){c.knownName=true}
  c.faceUp=up;
  log(`${names[selected.area]}のカードを${up?"表":"裏"}向きにしました`);
  saveState();render();
}

$("closeDiscard").onclick=()=>$("discardModal").classList.add("hidden");
document.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>move(b.dataset.to));
$("down").onclick=()=>face(false);
$("up").onclick=()=>face(true);
$("turnEnd").onclick=turnEnd;
$("firstBtn").onclick=()=>{if(state.players.length<2||state.started||meSlot!=="p1")return;$("firstChoice").value=state.firstChoice\vert{}\vert{}"random";$("firstModal").classList.remove("hidden")};
$("firstOk").onclick=()=>{
  state.firstChoice=$("firstChoice").value;state.first=null;
  saveState();$("firstModal").classList.add("hidden");render();
};
$("startBtn").onclick=()=>{if(state.players.length<2)return;startGame();render()};
$("undo").onclick=()=>{
  if(!undoStack.length){alert("戻せる操作がありません。");return}
  state=JSON.parse(undoStack.pop());
  log("直前の操作を取り消しました");saveState();render();
};
$("send").onclick=sendChat;
$("chatInput").onkeydown=e=>{if(e.key==="Enter")sendChat()};
function sendChat(){
  let t=$("chatInput").value.trim();if(!t)return;
  state.chat.push({slot:meSlot,text:t,t:Date.now()});
  $("chatInput").value="";saveState();render();
}
$("rematch").onclick=()=>{
  if(!state.started)return;
  if(!confirm("現在のデッキで再戦しますか？"))return;
  snap();state.started=false;state.first=null;
  state.players.forEach(p=>p.areas=null);
  state.history=[];saveState();render();
};
$("end").onclick=async()=>{
  if(!confirm("この部屋を終了しますか？"))return;
  try{await remove(roomRef())}catch(e){}
  location.reload();
};

$("enter").onclick=async()=>{
  let d=deckInput();roomNo=$("roomNo").value.trim();
  $("lobbyError").textContent="";
  if(!roomNo)return alert("部屋番号を入力してください。");
  if(d.length!==20)return alert("デッキを20枚入力してください。");
  if(!auth.currentUser)return alert("認証中のため少し待ってから再度お試しください。");

  roomPath=`rooms/${encodeURIComponent(roomNo).replace(/\./g,"%2E")}`;
  meId=auth.currentUser.uid;

  const rr=roomRef();
  const result=await runTransaction(rr, current=>{
    if(!current){
      return {
        room:roomNo,
        players:[{id:meId, slot:"p1", deck:d, areas:null}],
        started:false, history:[], chat:[], updatedAt:Date.now(), firstChoice:"random", first:null
      };
    }
    let r=current;
    if(!r.players)r.players=[];
    let existing=r.players.find(p=>p.id===meId);
    if(existing)return r;
    if(r.players.length>=2)return; // 満員
    r.players.push({id:meId, slot:"p2", deck:d, areas:null});
    r.updatedAt=Date.now();
    return r;
  });

  if(!result.committed){
    $("lobbyError").textContent="部屋が満員か、入室に失敗しました。";
    return;
  }

  state=result.snapshot.val();
  let me=state.players.find(p=>p.id===meId);
  if(!me){$("lobbyError").textContent="入室情報の取得に失敗しました。";return;}
  meSlot=me.slot;

  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");

  if(unsubscribe)unsubscribe();
  unsubscribe=onValue(rr, s=>{
    let val=s.val();
    if(!val){alert("部屋が削除されました。");location.reload();return;}
    state=val;
    render();
  });
  render();
};

onAuthStateChanged(auth, user=>{if(!user)signInAnonymously(auth).catch(console.error);});
signInAnonymously(auth).catch(console.error);
</script>
